<!-- Back to top: разметка, стили и скрипт с живой главной dariacuts.com -->
<a class="back-to-top" href="#" aria-label="Back to top" id="backToTop">↑</a>
<style>
  /* ===== Back to top ===== */
  .back-to-top {
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 600;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--c-sage);
    color: var(--c-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 800;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.25s;
    opacity: 0;
    transform: translateY(16px);
    pointer-events: none;
    box-shadow: 0 5px 0 rgba(44,54,40,0.3);
  }
  .back-to-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .back-to-top:hover { background: var(--c-paper); }
  @media (max-width: 720px) {
    .back-to-top { bottom: 18px; right: 16px; width: 40px; height: 40px; font-size: 16px; }
  }
  /* у новых страниц на телефоне снизу закреплена панель .mobile-chat (69px): кнопка встает над ней */
  @media (max-width: 640px) {
    .back-to-top { bottom: calc(81px + env(safe-area-inset-bottom)); }
  }
</style>
<script>
  // ===== Back to top =====
  (function() {
    const btn = document.getElementById('backToTop');
    window.addEventListener('scroll', function() {
      if (window.scrollY > 400) { btn.classList.add('visible'); }
      else { btn.classList.remove('visible'); }
    }, { passive: true });
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  })();
</script>
