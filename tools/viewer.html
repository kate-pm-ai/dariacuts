<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Daria Cuts · общий просмотр страниц</title>
<style>*{box-sizing:border-box}:root{--forest:#263022;--sage:#bac8b1;--paper:#e6e6e6;--ink:#2c3628}body{margin:0;background:var(--forest);color:var(--paper);font:14px system-ui,sans-serif;overflow:hidden}header{min-height:104px;padding:12px 20px;display:grid;gap:10px;border-bottom:1px solid #bac8b144}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px}.identity strong{font-size:16px}.identity small{opacity:.72}.views,.pages{display:flex;gap:8px}.pages{overflow-x:auto;padding-bottom:2px}.pages button{white-space:nowrap}button,a{font:inherit;color:inherit}button{cursor:pointer;background:transparent;border:1px solid #bac8b1;border-radius:99px;padding:8px 15px}button[aria-pressed=true]{background:var(--sage);color:var(--ink)}button:focus-visible,a:focus-visible{outline:3px solid white;outline-offset:3px}.open{font-size:12px;white-space:nowrap}.stage{height:calc(100dvh - 105px);display:flex;justify-content:center;padding:0 12px 12px;overflow:auto}iframe{height:100%;width:100%;border:1px solid #bac8b155;background:#404e3b;border-radius:10px}.stage.mobile iframe{width:390px;min-width:390px;max-width:100%;border-radius:22px}@media(max-width:720px){header{min-height:142px;padding:8px 12px}.topbar{align-items:flex-start;flex-wrap:wrap}.identity{width:100%}.stage{height:calc(100dvh - 143px)}button{padding:8px 12px}}</style></head>
<body><header><div class="topbar"><div class="identity"><strong>Daria Cuts</strong> <small>· все макеты</small></div><div class="views" aria-label="Режим просмотра"><button data-view="desktop" aria-pressed="true">Desktop</button><button data-view="mobile" aria-pressed="false">Mobile</button></div><a class="open" id="open-page" target="_blank" rel="noopener">Открыть страницу отдельно ↗</a></div><nav class="pages" aria-label="Страницы"><button data-page="home">Главная</button><button data-page="youtube">YouTube</button><button data-page="short-form">Short Form</button><button data-page="2d-animation">2D Animation</button><button data-page="motion-graphics">Motion Graphics</button></nav></header><main class="stage" id="stage"><iframe id="preview" title="Daria Cuts preview"></iframe></main>
<script>const pages={home:{label:'Главная',src:'../dariacuts-home/page.html'},youtube:{label:'YouTube Video Editing',src:'../dariacuts-youtube/page.html'},'short-form':{label:'Short-Form Video Editing',src:'../dariacuts-short-form/page.html'},'2d-animation':{label:'2D Animation Services',src:'../dariacuts-2d-animation/page.html'},'motion-graphics':{label:'Motion Graphics Services',src:'../dariacuts-motion-graphics/page.html'}};const stage=document.getElementById('stage'),frame=document.getElementById('preview'),openPage=document.getElementById('open-page');let state={page:'home',view:'desktop'};function readHash(){const p=new URLSearchParams(location.hash.slice(1));state.page=pages[p.get('page')]?p.get('page'):'home';state.view=p.get('view')==='mobile'?'mobile':'desktop'}function render(updateHash=true){const item=pages[state.page];stage.classList.toggle('mobile',state.view==='mobile');frame.src=item.src;frame.title=item.label+' · '+state.view;openPage.href=item.src;document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===state.page)));document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===state.view)));if(updateHash)history.replaceState(null,'','#page='+encodeURIComponent(state.page)+'&view='+state.view)}document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{state.page=b.dataset.page;render()}));document.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.view;render()}));addEventListener('hashchange',()=>{readHash();render(false)});readHash();render(false);</script></body></html>
